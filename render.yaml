services:
  # Backend API (.NET 8 Docker Web Service)
  - type: web
    name: qrmenu-backend-api
    runtime: docker
    plan: starter # Note: Change to free if deploying without persistent disk (Render disks require Starter plan)
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: qrmenu-backend-db
          property: connectionString
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JwtSettings__Key
        generateValue: true
      - key: JwtSettings__Issuer
        value: MenuManagementAPI
      - key: JwtSettings__Audience
        value: MenuManagementFrontend
      - key: Cors__AllowedOrigins__0
        value: https://qrmenu-management-frontend.onrender.com
    disk:
      name: uploads-disk
      mountPath: /app/wwwroot/uploads
      sizeGB: 1

  # Frontend (Angular Static Site)
  - type: web
    name: qrmenu-management-frontend
    env: static
    buildCommand: "cd frontend && npm ci && npm run build:render"
    staticPublishPath: "frontend/dist/frontend/browser"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: BACKEND_URL
        value: https://qrmenuglobal-q32y.onrender.com

databases:
  # PostgreSQL Database
  - name: qrmenu-backend-db
    plan: free
